global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# HAProxy's built-in stats page, so you can literally watch backends
# get marked UP/DOWN during the demo.
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 2s

frontend http_front
    bind *:80
    default_backend app_backends

# --- O2 BASELINE ---
# This check only asks "can I open a TCP connection / get a 200 on /health/shallow?"
# It cannot see that a backend's real dependency (its connection pool) is exhausted.
backend app_backends
    balance roundrobin
    option httpchk GET /health/shallow
    http-check expect status 200
    server backend1 backend1:8081 check inter 2s fall 2 rise 2
    server backend2 backend2:8082 check inter 2s fall 2 rise 2
