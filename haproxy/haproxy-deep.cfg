global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 2s

frontend http_front
    bind *:80
    default_backend app_backends

# --- O3 CONTRIBUTION ---
# This check hits /health/deep, which reflects real spare capacity in the
# backend's dependency pool (non-blocking, no side effects — so the check
# itself can't cascade failures, per O4 / NT3).
backend app_backends
    balance roundrobin
    option httpchk GET /health/deep
    http-check expect status 200
    server backend1 backend1:8081 check inter 2s fall 2 rise 2
    server backend2 backend2:8082 check inter 2s fall 2 rise 2
